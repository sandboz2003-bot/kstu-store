<!doctype html>
<html lang="my">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KSTU Store - E-Commerce & Payment</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans">
    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-40">
      <div
        class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center"
      >
        <h1 class="text-2xl font-bold text-indigo-600 flex items-center gap-2">
          <i class="fa-solid fa-store"></i> KSTU Store
        </h1>
        <div class="flex items-center gap-4">
          <button
            id="admin-toggle-btn"
            class="bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 cursor-pointer"
          >
            <i class="fa-solid fa-lock"></i> Admin Login
          </button>
          <button
            id="cart-btn"
            class="relative bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition flex items-center gap-2 cursor-pointer"
          >
            <i class="fa-solid fa-cart-shopping"></i> Cart
            <span
              id="cart-count"
              class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold"
              >0</span
            >
          </button>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
      <!-- Search & Category Bar -->
      <div
        class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8"
      >
        <div class="w-full md:w-1/3 relative">
          <input
            type="text"
            id="search-input"
            placeholder="ပစ္စည်းများကို ရှာရန်..."
            class="w-full pl-10 pr-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white"
          />
          <i
            class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400"
          ></i>
        </div>
        <div
          id="category-bar"
          class="flex flex-wrap gap-2 w-full md:w-auto justify-start md:justify-end"
        >
          <!-- Dynamic Categories -->
        </div>
      </div>

      <!-- Admin Panel -->
      <div
        id="admin-panel"
        class="hidden bg-white p-6 rounded-2xl shadow-lg mb-8 border border-indigo-100"
      >
        <div class="flex justify-between items-center mb-4">
          <h2
            id="form-title"
            class="text-xl font-bold text-indigo-600 flex items-center gap-2"
          >
            <i class="fa-solid fa-circle-plus"></i> ပစ္စည်းအသစ် ထည့်သွင်းရန်
          </h2>
          <button
            onclick="logoutAdmin()"
            class="bg-red-50 text-red-600 px-3 py-1.5 rounded-lg text-sm hover:bg-red-100 transition cursor-pointer"
          >
            Logout ထွက်မည်
          </button>
        </div>
        <form
          id="add-product-form"
          class="grid grid-cols-1 md:grid-cols-2 gap-4"
        >
          <input
            type="text"
            id="new-name"
            placeholder="ပစ္စည်းနာမည်"
            required
            class="border p-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
          <input
            type="number"
            id="new-price"
            placeholder="ဈေးနှုန်း (ကျပ်)"
            required
            class="border p-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />

          <div class="flex gap-2">
            <select
              id="new-category"
              class="border p-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 flex-1"
            >
              <!-- Dynamic Options -->
            </select>
            <button
              type="button"
              onclick="addNewCategory()"
              class="bg-gray-200 hover:bg-gray-300 px-3 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer"
              title="Category အသစ်ထည့်ရန်"
            >
              + အသစ်
            </button>
            <button
              type="button"
              onclick="deleteCurrentCategory()"
              class="bg-red-100 hover:bg-red-200 text-red-600 px-3 py-2.5 rounded-xl text-sm font-medium transition cursor-pointer"
              title="ရွေးထားသော Category ကို ဖျက်ရန်"
            >
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>

          <input
            type="text"
            id="new-image"
            placeholder="ပုံလင့်ခ် (Image URL)"
            required
            class="border p-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
          <input
            type="text"
            id="new-specs"
            placeholder="Specs များ (ကော်မာ , ဖြင့် ခွဲရန်)"
            class="border p-2.5 rounded-xl md:col-span-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />

          <div class="md:col-span-2 flex gap-2">
            <button
              type="submit"
              id="submit-btn"
              class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl hover:bg-indigo-700 font-medium transition cursor-pointer"
            >
              ပစ္စည်းစာရင်းသို့ ထည့်မည်
            </button>
            <button
              type="button"
              id="cancel-edit"
              onclick="resetForm()"
              class="hidden bg-gray-300 text-gray-700 px-6 py-2.5 rounded-xl hover:bg-gray-400 font-medium transition cursor-pointer"
            >
              မလုပ်တော့ပါ
            </button>
          </div>
        </form>
      </div>

      <!-- Product Grid -->
      <div
        id="product-grid"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"
      >
        <!-- Cloud Products -->
      </div>
    </main>

    <!-- Admin Login Modal -->
    <div
      id="login-modal"
      class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-2xl max-w-sm w-full p-6 relative shadow-2xl">
        <button
          onclick="
            document.getElementById('login-modal').classList.add('hidden')
          "
          class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl cursor-pointer"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
        <h2
          class="text-xl font-bold text-indigo-600 mb-4 flex items-center gap-2"
        >
          <i class="fa-solid fa-lock"></i> Admin Login
        </h2>
        <form id="login-form" class="space-y-4">
          <input
            type="email"
            id="admin-email"
            placeholder="Admin Email"
            required
            class="w-full border p-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
          <input
            type="password"
            id="admin-password"
            placeholder="Password"
            required
            class="w-full border p-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
          <button
            type="submit"
            class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold hover:bg-indigo-700 transition cursor-pointer"
          >
            Login ဝင်မည်
          </button>
        </form>
      </div>
    </div>

    <!-- Cart Sidebar -->
    <div
      id="cart-sidebar"
      class="fixed inset-y-0 right-0 w-96 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 flex flex-col"
    >
      <div
        class="p-4 bg-indigo-600 text-white flex justify-between items-center"
      >
        <h2 class="font-bold text-lg flex items-center gap-2">
          <i class="fa-solid fa-cart-shopping"></i> သင်၏ Cart နှင့် Order တင်ရန်
        </h2>
        <button
          id="close-cart"
          class="text-white hover:text-gray-200 text-xl cursor-pointer"
        >
          &times;
        </button>
      </div>
      <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
      <div class="p-4 border-t bg-gray-50 space-y-3">
        <input
          type="text"
          id="customer-name"
          placeholder="အမည် (Name)"
          class="w-full p-2 border rounded-lg text-sm bg-white"
        />
        <input
          type="text"
          id="customer-phone"
          placeholder="ဖုန်းနံပါတ် (Phone Number)"
          class="w-full p-2 border rounded-lg text-sm bg-white"
        />
        <textarea
          id="customer-address"
          placeholder="လိပ်စာ (Address)"
          rows="2"
          class="w-full p-2 border rounded-lg text-sm bg-white"
        ></textarea>

        <!-- Payment Method Selection -->
        <div class="space-y-1">
          <label class="block text-xs font-bold text-gray-700"
            >ငွေပေးချေမည့် နည်းလမ်း:</label
          >
          <select
            id="payment-method"
            onchange="togglePaymentProof()"
            class="w-full p-2 border rounded-lg text-sm bg-white"
          >
            <option value="KBZ Pay">KBZ Pay (ငွေလွှဲပြေစာ ပို့ရန်)</option>
            <option value="Wave Pay">Wave Pay (ငွေလွှဲပြေစာ ပို့ရန်)</option>
            <option value="COD">ပစ္စည်းရောက်ငွေချေ (COD)</option>
          </select>
        </div>

        <!-- Payment Instructions & QR Code -->
        <div
          id="payment-info-box"
          class="bg-indigo-50 p-3 rounded-lg text-xs space-y-2 text-indigo-900 border border-indigo-100"
        >
          <p class="font-bold text-center">
            ငွေပေးချေရန် QR Code (သို့) အကောင့်
          </p>

          <!-- Imgur မှရလာသော QR Code ပုံလင့်ခ်ကို ဤနေရာတွင် ထည့်ပါ -->
          <div class="flex justify-center">
            <img
              src="https://github.com/sandboz2003-bot/kstu-store/blob/main/photo_2026-10-23_17-25-17.jpg?raw=true"
              alt="Payment QR"
              class="w-32 h-32 object-contain rounded-lg border bg-white p-1"
            />
          </div>

          <div class="text-center space-y-0.5">
            <p>
              KBZPay/WavePay:
              <span class="font-bold text-indigo-600">09650627932 (Mg Mg)</span>
            </p>
          </div>

          <div class="pt-1">
            <label class="block font-bold mb-1"
              >ငွေလွှဲပြေစာ Screenshot တင်ရန်:</label
            >
            <input
              type="file"
              id="payment-screenshot"
              accept="image/*"
              class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer"
            />
          </div>
        </div>

        <div class="flex justify-between font-bold text-base pt-2">
          <span>စုစုပေါင်းကျသင့်ငွေ:</span>
          <span id="cart-total" class="text-indigo-600">0 ကျပ်</span>
        </div>
        <button
          onclick="checkoutTelegram()"
          class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-xl font-bold transition flex items-center justify-center gap-2 cursor-pointer shadow-md"
        >
          <i class="fa-brands fa-telegram text-xl"></i> Telegram Bot ဖြင့် Order
          တင်မည်
        </button>
      </div>
    </div>

    <!-- Product Details Modal -->
    <div
      id="product-modal"
      class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4"
    >
      <div class="bg-white rounded-2xl max-w-lg w-full p-6 relative shadow-2xl">
        <button
          id="close-modal"
          class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl cursor-pointer"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="modal-content"></div>
      </div>
    </div>

    <!-- Firebase & App Logic -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import {
        getFirestore,
        collection,
        getDocs,
        addDoc,
        updateDoc,
        deleteDoc,
        doc,
        setDoc,
        getDoc,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAXIF6lA63sXZGSlHjqcVui16dyVfw-lB0",
        authDomain: "kstu-store.firebaseapp.com",
        projectId: "kstu-store",
        storageBucket: "kstu-store.firebasestorage.app",
        messagingSenderId: "713367176185",
        appId: "1:713367176185:web:0fcfbf4dad0fdf05e2f328",
        measurementId: "G-JTXMYFM5ZQ",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let products = [];
      let categories = ["Electronics", "Fashion", "Accessories"];
      let cart = [];
      let currentCategory = "All";
      let editingId = null;
      let isAdminLoggedIn = false;

      const productGrid = document.getElementById("product-grid");
      const cartCount = document.getElementById("cart-count");
      const cartItems = document.getElementById("cart-items");
      const cartTotal = document.getElementById("cart-total");
      const cartSidebar = document.getElementById("cart-sidebar");
      const adminPanel = document.getElementById("admin-panel");
      const productModal = document.getElementById("product-modal");
      const modalContent = document.getElementById("modal-content");
      const categoryBar = document.getElementById("category-bar");
      const newCategorySelect = document.getElementById("new-category");
      const adminToggleBtn = document.getElementById("admin-toggle-btn");
      const loginModal = document.getElementById("login-modal");

      window.togglePaymentProof = function () {
        const method = document.getElementById("payment-method").value;
        const box = document.getElementById("payment-info-box");
        if (method === "COD") {
          box.classList.add("hidden");
        } else {
          box.classList.remove("hidden");
        }
      };

      async function fetchCategories() {
        try {
          const catDoc = await getDoc(doc(db, "settings", "categories"));
          if (catDoc.exists()) {
            categories = catDoc.data().list || [
              "Electronics",
              "Fashion",
              "Accessories",
            ];
          } else {
            await setDoc(doc(db, "settings", "categories"), {
              list: categories,
            });
          }
          renderCategories();
        } catch (error) {
          renderCategories();
        }
      }

      async function fetchProducts() {
        try {
          const querySnapshot = await getDocs(collection(db, "products"));
          products = [];
          querySnapshot.forEach((docSnap) => {
            products.push({ id: docSnap.id, ...docSnap.data() });
          });
          filterProducts();
        } catch (error) {
          console.error("Error fetching products");
        }
      }

      onAuthStateChanged(auth, (user) => {
        if (user) {
          isAdminLoggedIn = true;
          adminToggleBtn.innerHTML = `<i class="fa-solid fa-unlock"></i> Admin Panel`;
          adminToggleBtn.className =
            "bg-green-100 text-green-700 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 cursor-pointer";
          loginModal.classList.add("hidden");
          adminPanel.classList.remove("hidden");
          renderProducts(products);
        } else {
          isAdminLoggedIn = false;
          adminToggleBtn.innerHTML = `<i class="fa-solid fa-lock"></i> Admin Login`;
          adminToggleBtn.className =
            "bg-gray-100 hover:bg-gray-200 px-3 py-2 rounded-lg text-sm font-medium transition flex items-center gap-1 cursor-pointer";
          adminPanel.classList.add("hidden");
          renderProducts(products);
        }
      });

      document.getElementById("login-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("admin-email").value;
        const password = document.getElementById("admin-password").value;
        signInWithEmailAndPassword(auth, email, password)
          .then(() => alert("Admin အဖြစ် ဝင်ရောက်ပြီးပါပြီ!"))
          .catch((error) => alert("Login မအောင်မြင်ပါ: " + error.message));
      });

      window.logoutAdmin = function () {
        signOut(auth).then(() => alert("Admin အကောင့်မှ ထွက်လိုက်ပါပြီ။"));
      };

      adminToggleBtn.addEventListener("click", () => {
        if (!isAdminLoggedIn) loginModal.classList.remove("hidden");
        else adminPanel.classList.toggle("hidden");
      });

      function renderCategories() {
        categoryBar.innerHTML = `<button data-category="All" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium ${currentCategory === "All" ? "bg-indigo-600 text-white" : "bg-white text-gray-600 border"} transition cursor-pointer">အားလုံး</button>`;
        categories.forEach((cat) => {
          const isActive = currentCategory === cat;
          const btn = document.createElement("button");
          btn.className = `cat-btn px-4 py-2 rounded-xl text-sm font-medium ${isActive ? "bg-indigo-600 text-white" : "bg-white text-gray-600 border hover:bg-gray-100"} transition cursor-pointer`;
          btn.setAttribute("data-category", cat);
          btn.textContent = cat;
          categoryBar.appendChild(btn);
        });

        newCategorySelect.innerHTML = "";
        categories.forEach((cat) => {
          const opt = document.createElement("option");
          opt.value = cat;
          opt.textContent = cat;
          newCategorySelect.appendChild(opt);
        });

        document.querySelectorAll(".cat-btn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            currentCategory = e.target.getAttribute("data-category");
            filterProducts();
            renderCategories();
          });
        });
      }

      window.addNewCategory = async function () {
        if (!isAdminLoggedIn) return;
        const newCat = prompt("Category အသစ်အမည် ထည့်ပါ:");
        if (newCat && newCat.trim() !== "") {
          const formattedCat = newCat.trim();
          if (!categories.includes(formattedCat)) {
            categories.push(formattedCat);
            try {
              await setDoc(doc(db, "settings", "categories"), {
                list: categories,
              });
              renderCategories();
              newCategorySelect.value = formattedCat;
              alert("Category အသစ် ထည့်သွင်းပြီးပါပြီ!");
            } catch (error) {
              alert("Error: " + error.message);
            }
          } else {
            alert("ဤ Category သည် ရှိပြီးသား ဖြစ်ပါသည်။");
          }
        }
      };

      window.deleteCurrentCategory = async function () {
        if (!isAdminLoggedIn) return;
        const selectedCat = newCategorySelect.value;
        if (!selectedCat) return;
        if (confirm(`"${selectedCat}" Category ကို ဖျက်ရန် သေချာပါသလား?`)) {
          categories = categories.filter((cat) => cat !== selectedCat);
          try {
            await setDoc(doc(db, "settings", "categories"), {
              list: categories,
            });
            if (currentCategory === selectedCat) currentCategory = "All";
            renderCategories();
            filterProducts();
            alert("Category ကို ဖျက်ပြီးပါပြီ။");
          } catch (error) {
            alert("Error: " + error.message);
          }
        }
      };

      function renderProducts(items) {
        productGrid.innerHTML = "";
        if (items.length === 0) {
          productGrid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">ပစ္စည်း မရှိသေးပါ။</p>`;
          return;
        }
        items.forEach((prod) => {
          const card = document.createElement("div");
          card.className =
            "bg-white rounded-2xl shadow hover:shadow-lg transition p-4 flex flex-col justify-between border border-gray-100 relative group";

          let adminButtonsHtml = "";
          if (isAdminLoggedIn) {
            adminButtonsHtml = `
                        <button onclick="editProduct('${prod.id}')" class="bg-amber-100 text-amber-700 px-3 py-2 rounded-xl hover:bg-amber-200 transition cursor-pointer" title="ပြင်ဆင်ရန်"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteProduct('${prod.id}')" class="bg-red-100 text-red-600 px-3 py-2 rounded-xl hover:bg-red-200 transition cursor-pointer" title="ဖျက်ရန်"><i class="fa-solid fa-trash"></i></button>
                    `;
          }

          card.innerHTML = `
                    <div>
                        <div class="relative overflow-hidden rounded-xl mb-3 cursor-pointer" onclick="openProductModal('${prod.id}')">
                            <img src="${prod.image}" alt="${prod.name}" class="w-full h-48 object-cover group-hover:scale-105 transition duration-300">
                            <span class="absolute top-2 left-2 bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-full">${prod.category}</span>
                        </div>
                        <h3 class="font-bold text-lg mb-1 cursor-pointer hover:text-indigo-600 transition" onclick="openProductModal('${prod.id}')">${prod.name}</h3>
                        <p class="text-indigo-600 font-bold mb-3">${prod.price.toLocaleString()} ကျပ်</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="addToCart('${prod.id}')" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 transition flex items-center justify-center gap-1 cursor-pointer">
                            <i class="fa-solid fa-cart-plus"></i> ဝယ်မည်
                        </button>
                        ${adminButtonsHtml}
                    </div>
                `;
          productGrid.appendChild(card);
        });
      }

      function filterProducts() {
        const searchText = document
          .getElementById("search-input")
          .value.toLowerCase();
        const filtered = products.filter((prod) => {
          const matchesCategory =
            currentCategory === "All" || prod.category === currentCategory;
          const matchesSearch = prod.name.toLowerCase().includes(searchText);
          return matchesCategory && matchesSearch;
        });
        renderProducts(filtered);
      }

      document
        .getElementById("search-input")
        .addEventListener("input", filterProducts);

      document
        .getElementById("add-product-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!isAdminLoggedIn) return;

          const name = document.getElementById("new-name").value.trim();
          const price = parseInt(document.getElementById("new-price").value);
          const category = document.getElementById("new-category").value;
          const image = document.getElementById("new-image").value.trim();
          const specsInput = document.getElementById("new-specs").value.trim();
          let specs = specsInput
            ? specsInput.split(",").map((s) => s.trim())
            : ["Standard Quality"];

          try {
            if (!editingId) {
              await addDoc(collection(db, "products"), {
                name,
                price,
                category,
                image,
                specs,
              });
              alert("ပစ္စည်းအသစ် ထည့်သွင်းပြီးပါပြီ! 🎉");
            } else {
              await updateDoc(doc(db, "products", editingId), {
                name,
                price,
                category,
                image,
                specs,
              });
              alert("ပြင်ဆင်ပြီးပါပြီ! ✅");
              resetForm();
            }
            fetchProducts();
            document.getElementById("add-product-form").reset();
            adminPanel.classList.add("hidden");
          } catch (error) {
            alert("Error: " + error.message);
          }
        });

      window.editProduct = function (id) {
        if (!isAdminLoggedIn) return;
        const prod = products.find((p) => p.id === id);
        if (!prod) return;

        document.getElementById("new-name").value = prod.name;
        document.getElementById("new-price").value = prod.price;
        document.getElementById("new-category").value = prod.category;
        document.getElementById("new-image").value = prod.image;
        document.getElementById("new-specs").value = prod.specs
          ? prod.specs.join(", ")
          : "";

        editingId = id;
        document.getElementById("form-title").innerHTML =
          `<i class="fa-solid fa-pen-to-square"></i> ပစ္စည်းပြင်ဆင်ရန်`;
        document.getElementById("submit-btn").textContent =
          `ပြင်ဆင်မှု သိမ်းဆည်းမည်`;
        document.getElementById("cancel-edit").classList.remove("hidden");
        adminPanel.classList.remove("hidden");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      window.resetForm = function () {
        editingId = null;
        document.getElementById("add-product-form").reset();
        document.getElementById("form-title").innerHTML =
          `<i class="fa-solid fa-circle-plus"></i> ပစ္စည်းအသစ် ထည့်သွင်းရန်`;
        document.getElementById("submit-btn").textContent =
          `ပစ္စည်းစာရင်းသို့ ထည့်မည်`;
        document.getElementById("cancel-edit").classList.add("hidden");
        adminPanel.classList.add("hidden");
      };

      window.deleteProduct = async function (id) {
        if (!isAdminLoggedIn) return;
        if (confirm("ဤပစ္စည်းကို ဖျက်ရန် သေချာပါသလား?")) {
          try {
            await deleteDoc(doc(db, "products", id));
            fetchProducts();
            alert("ဖျက်ပြီးပါပြီ။");
          } catch (error) {
            alert("Error: " + error.message);
          }
        }
      };

      window.openProductModal = function (id) {
        const prod = products.find((p) => p.id === id);
        if (!prod) return;
        let specsHtml = prod.specs
          ? prod.specs
              .map(
                (s) =>
                  `<li class="flex items-center gap-2"><i class="fa-solid fa-check text-indigo-600 text-xs"></i> ${s}</li>`,
              )
              .join("")
          : "<li>အချက်အလက် မရှိပါ။</li>";

        modalContent.innerHTML = `
                <img src="${prod.image}" alt="${prod.name}" class="w-full h-56 object-cover rounded-xl mb-4">
                <span class="bg-indigo-100 text-indigo-600 text-xs px-2.5 py-1 rounded-full font-medium">${prod.category}</span>
                <h2 class="text-2xl font-bold mt-2 mb-1">${prod.name}</h2>
                <p class="text-xl font-bold text-indigo-600 mb-4">${prod.price.toLocaleString()} ကျပ်</p>
                <div class="mb-6">
                    <h4 class="font-bold text-gray-700 mb-2">အသေးစိတ် အချက်အလက်များ:</h4>
                    <ul class="space-y-1.5 text-sm text-gray-600 bg-gray-50 p-3 rounded-xl">${specsHtml}</ul>
                </div>
                <button onclick="addToCart('${prod.id}'); productModal.classList.add('hidden');" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition cursor-pointer">Cart ထဲသို့ ထည့်မည်</button>
            `;
        productModal.classList.remove("hidden");
      };

      document
        .getElementById("close-modal")
        .addEventListener("click", () => productModal.classList.add("hidden"));

      window.addToCart = function (id) {
        const prod = products.find((p) => p.id === id);
        if (!prod) return;
        const existing = cart.find((item) => item.id === prod.id);
        if (existing) existing.qty += 1;
        else cart.push({ ...prod, qty: 1 });
        updateCartUI();
        alert("Cart ထဲသို့ ထည့်ပြီးပါပြီ!");
      };

      function updateCartUI() {
        cartCount.textContent = cart.reduce((sum, item) => sum + item.qty, 0);
        cartItems.innerHTML = "";
        let total = 0;
        if (cart.length === 0) {
          cartItems.innerHTML = `<p class="text-gray-500 text-center py-4 text-sm">Cart ထဲတွင် ပစ္စည်းမရှိသေးပါ။</p>`;
        }
        cart.forEach((item, index) => {
          total += item.price * item.qty;
          const div = document.createElement("div");
          div.className =
            "flex items-center justify-between bg-gray-50 p-3 rounded-xl border border-gray-100";
          div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${item.image}" class="w-12 h-12 object-cover rounded-lg">
                        <div>
                            <h4 class="font-bold text-sm">${item.name}</h4>
                            <p class="text-xs text-gray-500">${item.price.toLocaleString()} ကျပ် x ${item.qty}</p>
                        </div>
                    </div>
                    <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 cursor-pointer p-1"><i class="fa-solid fa-trash-can"></i></button>
                `;
          cartItems.appendChild(div);
        });
        cartTotal.textContent = total.toLocaleString() + " ကျပ်";
      }

      window.removeFromCart = function (index) {
        cart.splice(index, 1);
        updateCartUI();
      };

      document
        .getElementById("cart-btn")
        .addEventListener("click", () =>
          cartSidebar.classList.remove("translate-x-full"),
        );
      document
        .getElementById("close-cart")
        .addEventListener("click", () =>
          cartSidebar.classList.add("translate-x-full"),
        );

      // Telegram Checkout with Payment Method & Screenshot
      window.checkoutTelegram = async function () {
        if (cart.length === 0) {
          alert("ကျေးဇူးပြု၍ Cart ထဲသို့ ပစ္စည်း အရင်ထည့်ပါ။");
          return;
        }
        const name = document.getElementById("customer-name").value.trim();
        const phone = document.getElementById("customer-phone").value.trim();
        const address = document
          .getElementById("customer-address")
          .value.trim();
        const paymentMethod = document.getElementById("payment-method").value;
        const screenshotInput = document.getElementById("payment-screenshot");

        if (!name || !phone) {
          alert("အမည်နှင့် ဖုန်းနံပါတ် ဖြည့်စွက်ပေးပါ။");
          return;
        }

        let message = `🛒 KSTU Store မှ Order အသစ်ဝင်ပါသည်\n`;
        message += `-----------------------------------\n`;
        message += `👤 အမည်: ${name}\n`;
        message += `📞 ဖုန်း: ${phone}\n`;
        message += `🏠 လိပ်စာ: ${address || "မပါ"}\n`;
        message += `💳 ငွေပေးချေမှု: ${paymentMethod}\n`;
        message += `-----------------------------------\n`;
        message += `📦 ဝယ်ယူသည့် ပစ္စည်းများ:\n`;

        let total = 0;
        cart.forEach((item, index) => {
          let itemTotal = item.price * item.qty;
          total += itemTotal;
          message += `${index + 1}. ${item.name} (${item.qty} ခု) - ${itemTotal.toLocaleString()} ကျပ်\n`;
        });
        message += `-----------------------------------\n`;
        message += `💰 စုစုပေါင်းကျသင့်ငွေ: ${total.toLocaleString()} ကျပ်`;

        const botToken = "8926787721:AAGahQfGYIk4ZKrzQWpWDwnvo6Etsd55Na0";
        const chatId = "1693313821";

        if (
          paymentMethod !== "COD" &&
          screenshotInput.files &&
          screenshotInput.files[0]
        ) {
          const formData = new FormData();
          formData.append("chat_id", chatId);
          formData.append("caption", message);
          formData.append("photo", screenshotInput.files[0]);

          const photoUrl = `https://api.telegram.org/bot${botToken}/sendPhoto`;
          try {
            const response = await fetch(photoUrl, {
              method: "POST",
              body: formData,
            });
            const data = await response.json();
            if (data.ok) {
              alert("Order နှင့် ငွေလွှဲပြေစာ ပို့ခြင်း အောင်မြင်ပါသည်။ 🎉");
              cart = [];
              updateCartUI();
              document
                .getElementById("cart-sidebar")
                .classList.add("translate-x-full");
            } else {
              alert("Order ပို့၍ မရပါ။ Token သို့မဟုတ် Chat ID ကို စစ်ဆေးပါ။");
            }
          } catch (error) {
            console.error("Error:", error);
            alert("ချိတ်ဆက်မှု အမှားအယွင်း ရှိနေပါသည်။");
          }
        } else {
          const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
          try {
            const response = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ chat_id: chatId, text: message }),
            });
            const data = await response.json();
            if (data.ok) {
              alert("Order တင်ခြင်း အောင်မြင်ပါသည်။ 🎉");
              cart = [];
              updateCartUI();
              document
                .getElementById("cart-sidebar")
                .classList.add("translate-x-full");
            } else {
              alert("Order တင်၍ မရပါ။");
            }
          } catch (error) {
            console.error("Error:", error);
            alert("ချိတ်ဆက်မှု အမှားအယွင်း ရှိနေပါသည်။");
          }
        }
      };

      fetchCategories();
      fetchProducts();
    </script>
  </body>
</html>
